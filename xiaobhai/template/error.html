<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#08080f">
  <meta name="robots" content="noindex, nofollow">
  <title>{{ title }} | {{ site_name }}</title>
  <style>
:root { --bg:#08080f; --card:#12121d; --line:#24243a; --text:#f4f4fa; --muted:#9a9ab5; --a1:#ec4899; --a2:#8b5cf6; --ok:#22c55e; }
* { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
html,body { min-height:100%; }
body { background:radial-gradient(900px 420px at 50% -8%, rgba(139,92,246,.28), transparent 60%),
       radial-gradient(700px 360px at 90% 110%, rgba(236,72,153,.16), transparent 60%), var(--bg);
  color:var(--text); font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; min-height:100vh; display:flex; flex-direction:column; }
header { padding:14px 18px; background:rgba(18,18,29,.8); backdrop-filter:blur(8px); border-bottom:1px solid var(--line); text-align:center; }
header a { text-decoration:none; font-weight:800; font-size:20px; letter-spacing:.3px;
  background:linear-gradient(90deg,var(--a1),var(--a2)); -webkit-background-clip:text; background-clip:text; color:transparent; }
main { flex:1; display:flex; align-items:center; justify-content:center; padding:22px 16px; }
.card { background:linear-gradient(180deg,rgba(26,26,42,.95),rgba(18,18,29,.95)); border:1px solid var(--line); border-radius:22px;
  padding:30px 22px 24px; width:100%; max-width:440px; text-align:center; box-shadow:0 18px 60px rgba(0,0,0,.55); }
.icon { width:74px; height:74px; margin:0 auto 14px; border-radius:22px; display:flex; align-items:center; justify-content:center; font-size:34px;
  background:linear-gradient(135deg,var(--a1),var(--a2)); box-shadow:0 10px 30px rgba(139,92,246,.45); }
h1 { font-size:16px; font-weight:650; word-break:break-word; line-height:1.45; margin-bottom:12px; }
.badges { display:flex; gap:8px; justify-content:center; flex-wrap:wrap; margin-bottom:6px; }
.badge { font-size:12px; color:var(--muted); background:rgba(255,255,255,.04); border:1px solid var(--line); border-radius:999px; padding:4px 12px; }
.btn { display:block; width:100%; cursor:pointer; border:0; border-radius:14px; padding:14px 18px; font-size:15.5px; font-weight:700; color:#fff;
  text-decoration:none; text-align:center; background:linear-gradient(90deg,var(--a1),var(--a2)); transition:transform .12s, opacity .12s; }
.btn:active { transform:scale(.98); }
.btn.alt { background:rgba(255,255,255,.05); border:1px solid var(--line); font-weight:600; }
.stack { display:grid; gap:10px; margin-top:16px; }
footer { text-align:center; padding:16px; color:var(--muted); font-size:12px; border-top:1px solid var(--line); }
footer a { color:var(--text); text-decoration:none; font-weight:600; }

    .icon { background:linear-gradient(135deg,#ef4444,#f97316); box-shadow:0 10px 30px rgba(239,68,68,.35); }
    p.msg { color:var(--muted); font-size:14px; line-height:1.6; margin-top:6px; }
  </style>
</head>
<body>
  <header><a href="{{ website_url }}">{{ site_name }}</a></header>
  <main>
    <div class="card">
      <div class="icon">⚠️</div>
      <h1>{{ title }}</h1>
      <p class="msg">{{ message }}</p>
      <div class="stack">
        <a class="btn" href="{{ website_url }}">🌐 Go to {{ site_name }}</a>
        <a class="btn alt" href="{{ updates_url }}">📢 Updates channel</a>
      </div>
    </div>
  </main>
  <footer>&copy; <script>document.write(new Date().getFullYear())</script> <a href="{{ website_url }}">{{ site_name }}</a></footer>
</body>
</html>
